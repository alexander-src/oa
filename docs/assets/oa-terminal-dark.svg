<svg xmlns="http://www.w3.org/2000/svg" width="820" height="316" viewBox="0 0 820 316" role="img" aria-label="oa demo and oa verify terminal output">
  <style>
    .chrome { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .cmd { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #e6edf3; }
    .prompt { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #58a6ff; }
    .ok { font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3fb950; }
    .warn { font: 600 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #d29922; }
    .dim { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .body { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
  </style>

  <rect x="1" y="1" width="818" height="314" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>
  <rect x="1" y="1" width="818" height="34" rx="10" fill="#161b22"/>
  <rect x="1" y="24" width="818" height="11" fill="#161b22"/>
  <line x1="1" y1="35" x2="819" y2="35" stroke="#30363d" stroke-width="1"/>

  <circle cx="20" cy="18" r="5" fill="#f85149"/>
  <circle cx="36" cy="18" r="5" fill="#d29922"/>
  <circle cx="52" cy="18" r="5" fill="#3fb950"/>
  <text x="410" y="22" text-anchor="middle" class="chrome">oa v0.3.0 · 1-second self-contained demo &amp; CI verification gate</text>

  <text x="20" y="60" class="prompt">$</text>
  <text x="34" y="60" class="cmd">oa demo</text>
  <text x="20" y="80" class="body">  [1/4] oa init      : baseline 48.85 ms | top hotspot count_unique (96.9% self) | 1 locked file</text>
  <text x="20" y="99" class="warn">  [2/4] Cheat Guard  : blocked edit to locked test_work.py (Verdict: CheatBlocked) -&gt; reverted</text>
  <text x="20" y="118" class="warn">  [3/4] Equiv Gate   : blocked wrong output despite faster runtime (EquivalenceFail) -&gt; reverted</text>
  <text x="20" y="137" class="ok">  [4/4] Verified win : 49.23 ms -&gt; 7.16 ms (6.84x, 95% CI [6.67x, 7.11x], p=0.0051, exact SHA-256)</text>
  <text x="20" y="156" class="dim">Demo finished in 1.0s and cleaned up temp repo.</text>

  <line x1="20" y1="172" x2="800" y2="172" stroke="#21262d" stroke-width="1"/>

  <text x="20" y="196" class="prompt">$</text>
  <text x="34" y="196" class="cmd">oa verify --pairs 20</text>
  <text x="230" y="196" class="dim"># DaveGamble/cJSON (-O3 C, 19 CTest suites)</text>
  <text x="20" y="216" class="ok">VERIFIED: 1.89x wall (95% CI [1.85x, 1.94x], p=0.0000), -1.4% peak RSS, SHA-256 exact, 180 locked</text>

  <text x="20" y="242" class="prompt">$</text>
  <text x="34" y="242" class="cmd">oa verify --pairs 20</text>
  <text x="230" y="242" class="dim"># nodeca/js-yaml (Node.js v22, 1,633 core + YAML 1.2 spec tests)</text>
  <text x="20" y="262" class="ok">VERIFIED: 1.37x wall (95% CI [1.35x, 1.43x], p=0.0000), -32.8% peak RSS, SHA-256 exact, 34 locked</text>

  <text x="20" y="288" class="prompt">$</text>
  <text x="34" y="288" class="cmd">oa report --format svg --theme dark --out bench.svg</text>
  <text x="415" y="288" class="dim"># drop-in SVG chart for your PR</text>
</svg>
