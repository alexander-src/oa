  <text x="28" y="172" class="sub">Python · --metric rss · bundled demo</text>
  <rect x="280" y="146" width="215" height="10" rx="3" fill="#21262d"/>
  <rect x="280" y="160" width="26" height="10" rx="3" fill="#58a6ff"/>
