<svg xmlns="http://www.w3.org/2000/svg" width="880" height="558" viewBox="0 0 880 558" role="img" aria-label="Verified multi-language speedups and peak RSS reductions measured with oa">
  <style>
    .title { font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .hdr-right { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .legend { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .repo { font: 600 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .sub { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .gain-wall { font: 700 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #3fb950; }
    .gain-rss { font: 700 13.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #58a6ff; }
    .num { font: 500 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #c9d1d9; }
    .meta { font: 400 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #8b949e; }
    .foot { font: 400 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
  </style>

  <rect x="1" y="1" width="878" height="556" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.2"/>

  <text x="28" y="34" class="title">Verified gains measured with oa (Python · Rust · C · Node.js)</text>
  <text x="852" y="34" text-anchor="end" class="hdr-right">interleaved A/B · Mann-Whitney U · exact SHA-256</text>
  <line x1="28" y1="48" x2="852" y2="48" stroke="#21262d" stroke-width="1"/>

  <rect x="280" y="60" width="11" height="8" rx="2" fill="#30363d"/>
  <text x="297" y="68" class="legend">Baseline (100%)</text>
  <rect x="405" y="60" width="11" height="8" rx="2" fill="#3fb950"/>
  <text x="422" y="68" class="legend">After oa (wall time)</text>
  <rect x="546" y="60" width="11" height="8" rx="2" fill="#58a6ff"/>
  <text x="563" y="68" class="legend">After oa (peak RSS)</text>

  <!-- Row 1: sqlparse 10.5x -->
  <text x="28" y="102" class="repo">andialbrecht/sqlparse</text>
  <text x="28" y="118" class="sub">Python · bench_grouping · 537/537 tests</text>
  <rect x="280" y="92" width="215" height="10" rx="3" fill="#21262d"/>
  <rect x="280" y="106" width="20" height="10" rx="3" fill="#3fb950"/>
  <text x="564" y="108" text-anchor="end" class="gain-wall">10.5x</text>
  <text x="852" y="102" text-anchor="end" class="num">68.1 ms -&gt; 6.5 ms</text>
  <text x="852" y="118" text-anchor="end" class="meta">4.3x to 10.5x upstream · 2.55x E2E</text>

  <!-- Row 2: ram_aggregator 8.34x RSS -->
