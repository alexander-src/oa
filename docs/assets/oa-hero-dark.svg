  <rect x="280" y="362" width="215" height="10" rx="3" fill="#21262d"/>
  <rect x="280" y="376" width="114" height="10" rx="3" fill="#3fb950"/>
  <text x="564" y="378" text-anchor="end" class="gain-wall">1.89x</text>
  <text x="852" y="372" text-anchor="end" class="num">104.2 -&gt; 55.6 ms</text>
  <text x="852" y="388" text-anchor="end" class="meta">-39.7% insns · -55.7% br-miss · 5.0 IPC</text>

