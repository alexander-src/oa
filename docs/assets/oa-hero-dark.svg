  <text x="28" y="442" class="sub">TS / Node.js · 80M/wk · v8-cpu-prof · 1,633 tests</text>
  <rect x="280" y="416" width="215" height="10" rx="3" fill="#21262d"/>
  <rect x="280" y="430" width="121" height="10" rx="3" fill="#3fb950"/>
  <text x="564" y="432" text-anchor="end" class="gain-wall">1.77x</text>
  <text x="852" y="426" text-anchor="end" class="num">78.3 -&gt; 44.2 ms</text>
  <text x="852" y="442" text-anchor="end" class="meta">1.37x CLI · -32.8% RSS · p = 0.0000</text>

  <!-- Row 8: brave/adblock-rust 1.05x -->
  <text x="28" y="480" class="repo">brave/adblock-rust</text>
  <text x="28" y="496" class="sub">Rust · 134k rules · linux:perf · 246 tests</text>
