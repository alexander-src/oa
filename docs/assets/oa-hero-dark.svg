  <line x1="28" y1="518" x2="852" y2="518" stroke="#21262d" stroke-width="1"/>
  <text x="28" y="540" class="foot">Shorter bars are better. Full patches, perf counters, and rejected dead ends live under docs/showcases/.</text>
