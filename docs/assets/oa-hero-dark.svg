  <text x="28" y="334" class="sub">Python · docs corpus · 1,230/1,230 tests</text>
  <rect x="280" y="308" width="215" height="10" rx="3" fill="#21262d"/>
  <rect x="280" y="322" width="112" height="10" rx="3" fill="#3fb950"/>
  <text x="564" y="324" text-anchor="end" class="gain-wall">1.92x</text>
  <text x="852" y="318" text-anchor="end" class="num">497.3 -&gt; 258.8 ms</text>
  <text x="852" y="334" text-anchor="end" class="meta">1.53x CLI · p = 0.0000</text>

